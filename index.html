const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const KEY = "tsxbot-site-key";
async function derive(pw) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(P.salt), iterations: P.iter, hash: "SHA-256" },
                                 base, { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
}
async function show(key) {
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(P.iv) }, key, b64(P.ct));
  document.open(); document.write(new TextDecoder().decode(plain)); document.close();
}
// A key remembered on this device opens the page directly — after load, so the new page fully replaces this one.
window.addEventListener("load", async () => {
  let saved = null;
  try { saved = localStorage.getItem(KEY); } catch (e) {}
  if (!saved) return;
  try {
    await show(await crypto.subtle.importKey("raw", b64(saved), "AES-GCM", true, ["decrypt"]));
  } catch (e) { try { localStorage.removeItem(KEY); } catch (e2) {} }
});
document.getElementById("f").addEventListener("submit", async ev => {
  ev.preventDefault();
  const err = document.getElementById("err");
  err.textContent = "Unlocking…";
  try {
    const key = await derive(document.getElementById("pw").value);
    if (document.getElementById("rem").checked) {
      const raw = new Uint8Array(await crypto.subtle.exportKey("raw", key));
      try { localStorage.setItem(KEY, btoa(String.fromCharCode(...raw))); } catch (e) {}
    }
    await show(key);
  } catch (e) { err.textContent = "Wrong password."; }
});
